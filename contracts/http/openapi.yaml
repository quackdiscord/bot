                $ref: '#/components/schemas/QuackOpsStatusResponse'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Any other error, such as a 500
      security:
      - opsKey: []
      summary: Queue and action health across all guilds
      tags:
      - health
  /readyz:
    get:
      description: A failed check makes this a 503 with the standard error envelope.
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReadinessResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Service Unavailable
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Any other error, such as a 500
      summary: Report whether the bot can take moderation work
      tags:
      - health
  /status:
    get:
      description: Always 200; /readyz is the probe that fails.
      operationId: getStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiStatusResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Any other error, such as a 500
      summary: Report Discord, Redis, and database connectivity
      tags:
      - health
