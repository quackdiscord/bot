      parameters:
      - description: The CSRF cookie's value. Required with the session cookie; not
          with a bearer token.
        in: header
        name: X-CSRF-Token
        schema:
          description: The CSRF cookie's value. Required with the session cookie;
            not with a bearer token.
          type: string
      responses:
