openapi: 3.1.0
info:
  description: |-
    The Quack dashboard API.

    Every error status (400 and up) carries the error envelope, whatever the
    handler wrote. Unknown paths and wrong methods are 404s.

    The dashboard authenticates with the HttpOnly session cookie set by Discord
    sign-in (quack_session by default). Writes made with the cookie must come from
    an allowed Origin and echo the CSRF cookie (quack_csrf by default, also
    returned as csrf_token by /auth/me) in X-CSRF-Token. A bearer session token is
    accepted instead of the cookie and skips the CSRF check.

    Writes marked with an Idempotency-Key header are safe to retry with the same
    key: a completed request is replayed with Idempotency-Replayed: true, one
    still running is a 409 with Retry-After, and reusing a key for a different
    request is a 409.

    This file is generated from the Go route table. Do not edit it; run
    "go generate ./..." from apps/backend.
  title: Quack HTTP API
  version: "5"
paths:
  /auth/discord/callback:
    get:
      description: Sets the session and CSRF cookies, then redirects to the dashboard,
        or returns the session if sign-in started with mode=json.
      operationId: finishDiscordLogin
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSignInResponse'
          description: Sign-in started with mode=json
        "302":
          description: Found
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Service Unavailable
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Any other error, such as a 500
      summary: Finish Discord sign-in
      tags:
      - auth
  /auth/discord/login:
    get:
      description: Sets the OAuth state cookie, then redirects to Discord, or with
        mode=json returns the authorization URL.
      operationId: startDiscordLogin
      parameters:
      - in: query
        name: mode
        schema:
          enum:
          - redirect
          - json
          type: string
      - in: query
        name: redirect_to
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
